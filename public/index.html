
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustCall</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #3730a3;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            background: #4338ca;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📱 TrustCall</h1>
        <p>Check a phone number against our demo database.</p>

        <form id="checkForm">
            <input
                type="tel"
                id="number"
                placeholder="Enter 10-digit phone number"
                maxlength="10"
                inputmode="numeric"
                required
            >
            <button type="submit">Check Number</button>
        </form>

        <div id="result" aria-live="polite"></div>

        <p><small>
            Demo only: results are not verified reports about real callers.
        </small></p>
    </div>

    <script>
        const form = document.getElementById("checkForm");
        const numberInput = document.getElementById("number");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const number = numberInput.value.trim();

            result.textContent = "Checking...";

            try {
                const response = await fetch("/check-number", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ number })
                });

                const data = await response.json();

                result.replaceChildren();

                const heading = document.createElement("h3");
                heading.textContent = data.status || "Unable to check";
                result.appendChild(heading);

                const message = document.createElement("p");
                message.textContent =
                    data.warning || data.message || "Please try again.";
                result.appendChild(message);

            } catch (error) {
                result.textContent =
                    "Could not connect to the server. Please try again.";
            }
        });
    </script>
</body>
</html>
